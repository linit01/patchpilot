# ─────────────────────────────────────────────────────────────────────────────
# PatchPilot — PersistentVolumes (static volumes only)
# Generated by install-k3s.sh
#
# Only volumes that need a STATIC PV appear here:
#   • NFS-backed volumes (explicit server/share) — static NFS PV.
#   • hostPath volumes (no StorageClass) — static hostPath PV pinned to a node.
#
# Volumes backed by a dynamic provisioner (e.g. rancher.io/local-path) are
# PVC-only — the provisioner creates the PV in its own directory, so no static
# PV is emitted for them and the matching ${...PV_DOC} slot below is empty.
#
# Static PVs use human-readable names (patchpilot-postgres-data, etc.) with a
# claimRef that pre-binds each to its matching PVC.
#   postgres / ansible — reclaimPolicy: Delete (disposable; daily backups).
#   backups            — reclaimPolicy: Retain  (survives uninstall for restore).
# ─────────────────────────────────────────────────────────────────────────────
${PP_POSTGRES_PV_DOC}
${PP_BACKUPS_PV_DOC}
${PP_ANSIBLE_PV_DOC}
