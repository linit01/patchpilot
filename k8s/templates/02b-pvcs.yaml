---
# ─────────────────────────────────────────────────────────────────────────────
# PatchPilot — PersistentVolumeClaims
# Generated by install-k3s.sh
#
# For STATIC volumes the ${...VOLNAME} slot expands to "volumeName: <name>",
# pinning each PVC to its named PV (02-pvs.yaml) so `kubectl get pv` shows
# patchpilot-* names rather than pvc-<uuid>.
#
# For DYNAMIC volumes the slot is empty — no volumeName — so the StorageClass's
# provisioner creates and binds the volume on its own.
# ─────────────────────────────────────────────────────────────────────────────

# PostgreSQL data volume
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: patchpilot-postgres-data
  namespace: ${PP_NAMESPACE}
  labels:
    app.kubernetes.io/name: patchpilot
    app.kubernetes.io/component: postgres
spec:
  accessModes: [ReadWriteOnce]
${PP_POSTGRES_VOLNAME}
  resources:
    requests:
      storage: ${PP_POSTGRES_STORAGE_SIZE}
  ${PP_POSTGRES_STORAGE_CLASS_SPEC}

# Backup archives volume
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: patchpilot-backups
  namespace: ${PP_NAMESPACE}
  labels:
    app.kubernetes.io/name: patchpilot
    app.kubernetes.io/component: backups
spec:
  accessModes: [ReadWriteOnce]
${PP_BACKUPS_VOLNAME}
  resources:
    requests:
      storage: ${PP_BACKUPS_STORAGE_SIZE}
  ${PP_APP_STORAGE_CLASS_SPEC}

# Ansible playbooks / inventory volume (local storage — small files, no NFS needed)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: patchpilot-ansible-data
  namespace: ${PP_NAMESPACE}
  labels:
    app.kubernetes.io/name: patchpilot
    app.kubernetes.io/component: ansible
spec:
  accessModes: [ReadWriteOnce]
${PP_ANSIBLE_VOLNAME}
  resources:
    requests:
      storage: ${PP_ANSIBLE_STORAGE_SIZE}
  ${PP_ANSIBLE_STORAGE_CLASS_SPEC}
