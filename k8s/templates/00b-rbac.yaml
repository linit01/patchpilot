# ─────────────────────────────────────────────────────────────────────────────
# PatchPilot — RBAC
#
# The backend pod needs two levels of permission:
#
# Role (namespaced) — resources that live inside the patchpilot namespace:
#   secrets/patch      — patch PATCHPILOT_ENCRYPTION_KEY during restore
#   deployments        — scale down postgres/frontend/backend during uninstall & restore
#   pods               — list/watch for kubectl wait --for=delete during uninstall
#   jobs               — create/get/list/watch/delete the hostPath cleanup Job on uninstall
#
# ClusterRole (cluster-scoped) — resources that live outside any namespace:
#   namespaces/delete  — delete the patchpilot namespace on uninstall
#   persistentvolumes  — list/delete PVs on uninstall (Retain policy edge cases)
#   clusterissuers     — delete cert-manager ClusterIssuer on uninstall
#
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patchpilot-backend
  namespace: ${PP_NAMESPACE}
  labels:
    app.kubernetes.io/name: patchpilot
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: patchpilot-installer
---
# ── Namespaced Role ───────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patchpilot-backend
  namespace: ${PP_NAMESPACE}
  labels:
    app.kubernetes.io/name: patchpilot
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: patchpilot-installer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["patchpilot-secrets"]
    verbs: ["get", "patch"]
  # Scale down all deployments during uninstall and backup/restore
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
  # Watch pods for kubectl wait --for=delete during uninstall
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patchpilot-backend
  namespace: ${PP_NAMESPACE}
  labels:
    app.kubernetes.io/name: patchpilot
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: patchpilot-installer
subjects:
  - kind: ServiceAccount
    name: patchpilot-backend
    namespace: ${PP_NAMESPACE}
roleRef:
  kind: Role
  name: patchpilot-backend
  apiGroup: rbac.authorization.k8s.io
---
# ── ClusterRole for cluster-scoped resources ─────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: patchpilot-backend
  labels:
    app.kubernetes.io/name: patchpilot
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: patchpilot-installer
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["${PP_NAMESPACE}"]
    verbs: ["delete"]
  # Uninstall reclaims only the PVs whose claimRef points into this namespace
  # (patchpilot-postgres-data / patchpilot-ansible-data — the backups PV is
  # deliberately excluded so Retain preserves it for restore).  Those PVs are
  # dynamically named (pvc-<uuid>), so resourceNames can't pin them; `list` is
  # required to resolve claimRef->name, and RBAC does not honour resourceNames
  # on list at all.  The namespace filtering is enforced in uninstall_api.py,
  # not by RBAC — narrowing further would need a label-selector-scoped API,
  # which Kubernetes RBAC does not support.
  #
  # NOTE: `patch` is intentionally NOT granted.  uninstall_api.py has a
  # `kubectl patch pv` call to flip Retain->Delete, but it is only reached for a
  # dynamically-provisioned PV that is ALSO on a Retain StorageClass.  In the
  # normal deployment the SC already reclaims with Delete, so the call is skipped
  # and the provisioner cleans up when the namespace (and its PVC) goes away —
  # verified in practice: only the backups volume survives an uninstall.
  # Granting `patch` would widen this ClusterRole to enable an edge-case path
  # that isn't needed here; if that path is ever wanted, add the verb as its own
  # separately-tested change rather than in a permission-narrowing pass.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list", "delete"]
  # Scoped to the single issuer the uninstaller actually deletes, instead of
  # every ClusterIssuer in the cluster.
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    resourceNames: ["letsencrypt-prod"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: patchpilot-backend
  labels:
    app.kubernetes.io/name: patchpilot
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: patchpilot-installer
subjects:
  - kind: ServiceAccount
    name: patchpilot-backend
    namespace: ${PP_NAMESPACE}
roleRef:
  kind: ClusterRole
  name: patchpilot-backend
  apiGroup: rbac.authorization.k8s.io
